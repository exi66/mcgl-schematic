# Checks: lint, formatting, types, tests, build.
# Runs on pushes and pull requests to main; pages.yml also calls it before every deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  # A deploy calls this workflow too: keep its run separate from the push/PR runs.
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  # Superseded pushes and PR updates are cancelled; release (tag) checks always finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
