<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>%VITE_SITE_TITLE%</title>
    <meta name="description" content="%VITE_SITE_DESCRIPTION%" />

    <!-- Link previews (forum, Discord, Telegram, VK): values come from .env -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="exi.moe" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="%VITE_SITE_TITLE%" />
    <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Sets the theme class before the first paint (no light flash): the link's ?theme= wins, then the saved choice
      // (localStorage `theme`, shared by every project on the domain), then the system setting.
      try {
        var t = new URLSearchParams(location.search).get('theme');
        if (t !== 'light' && t !== 'dark') t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          var legacy = localStorage.getItem('theme-dark');
          t = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light' : null;
        }
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
